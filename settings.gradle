pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'GalaxyAdaptiveStatusBar'
include ':app'

// Opt-in, device-only privacy animation probe; not included in any app release.
if (providers.gradleProperty('privacyFixture').isPresent()) {
    include ':privacyFixture'
    project(':privacyFixture').projectDir = file('tools/fixtures/privacy')
}
